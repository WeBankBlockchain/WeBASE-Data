server:
  port: 43781
  servlet:
    context-path: /wsbcs-chdis
  tomcat:
    accept-count: 1000
    max-threads: 500
    min-spare-threads: 100

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wsbcschdis?useUnicode=true&autoReconnect=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&connectTimeout=10000&socketTimeout=60000&allowMultiQueries=true&useFractionalSeconds=true&useUnbufferedInput=false&serverTimezone=Asia/Shanghai
    username: "root"
    password: "123456"
    driverClassName: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    defaultAutoCommit: true
    initialSize: 25
    maxActive: 128
    minIdle: 25
    testOnBorrow: false
    testOnReturn: false
    testWhileIdle: true
    validationQuery: SELECT 1
    timeBetweenEvictionRunsMillis: 34000
    minEvictableIdleTimeMillis: 34000
    removeAbandoned: false
    logAbandoned: true
    removeAbandonedTimeout: 54
    maxWait: 10000
    poolPreparedStatements: false
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  servlet:
    multipart:
      max-request-size: 32MB # request max size
      max-file-size: 32MB # single file size
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

constant:
  defaultChainId: "chain0_group0"
  
  bac20Address: ""
  rechargeProxyAddress: ""
  weworldManageAddress: ""
  beanSystemRecycleAddress: ""
  zombieAddress: ""
  redPacketProxyAddress: ""
  ## 统计数据刷新间隔（ms）
  cacheInterval: 60000
  
  ## certPath
  v3ConfigPath: "D:\\plateform\\ws\\ws_self\\WSBCS-CHDIS\\src\\main\\resources\\cert-v3\\"

  ## block info (pulling data from chain)
  isBlockPullFromZero: false
  pullBlockInitCnts: 1000
  pullBlockSleepTime: 10
  pullBlockTaskCron: "0/10 * * * * ?"
  pullBlockTimeout: 600000
  blockRetainMax: 10
  transRetainMax: 100
  ## delete retain max block and trans data
  isDeleteInfo: true
  deleteInfoTimeout: 30000
  deleteInfoCron: "*/30 * * * * ?"
  ## stat txn daily
  statisticsTransDailyCron: "0/20 * * * * ?"
  ## 每分钟更新一次bac20的统计数据
  syncStatTaskCron: "0 0/1 * * * ?"
  userFlowMaxCnt: 50000
  orgFlowMaxCnt: 200000
  
  privateStr: ""
  publicStr: ""

jedis:
  # config
  ip: 127.0.0.1
  port: 6379
  authPwd: 123456
  # pool
  maxTotal: 32
  maxIdle: 32
  minIdle: 16
  maxWaitMillis: 1000
  connectionTimeout: 1000
  socketTimeout: 1000
  testOnBorrow: false
  # jedis db index, -1是不选db
  select: 1

aspect:
  # 单用户限流，多久最多一次请求（ms）
  singleLimitInterval: 1000
  # 分布式锁失效时间：超时未自行解锁，则锁失效（ms）
  defLockExpireTime: 10000
  # 抢锁时间间隔（ms）
  requestLockInterval: 200
  # 单进程最大抢锁线程数，超过则会在取得抢锁线程时阻塞
  maxLockPoolSize: 500

mybatis:
  typeAliasesPackage: com.webank.wsbcs.chdis.common.dao
  configuration:
    map-underscore-to-camel-case: true

executor:
  corePoolSize: 50
  maxPoolSize: 75
  queueSize: 50
  threadNamePrefix: "server-async-"

logging:
  config: classpath:log4j2.xml
  level:
    com.webank.wsbcs.chdis: info

swagger:
  enabled: true
