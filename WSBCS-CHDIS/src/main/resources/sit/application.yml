server:
  port: 43781
  servlet:
    context-path: /wsbcs-chdis
  tomcat:
    accept-count: 1000
    max-threads: 500
    min-spare-threads: 100

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://[#db_ipport]/[#dbName_wsbcschdis]?useUnicode=true&autoReconnect=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&connectTimeout=10000&socketTimeout=60000&allowMultiQueries=true&useFractionalSeconds=true&useUnbufferedInput=false&serverTimezone=Asia/Shanghai
    username: "[#user_wsbcschdis]"
    password: "[#pass_wsbcschdis]"
    driverClassName: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    defaultAutoCommit: true
    initialSize: 25
    maxActive: 128
    minIdle: 25
    testOnBorrow: false
    testOnReturn: false
    testWhileIdle: true
    validationQuery: SELECT 1
    timeBetweenEvictionRunsMillis: 34000
    minEvictableIdleTimeMillis: 34000
    removeAbandoned: false
    logAbandoned: true
    removeAbandonedTimeout: 54
    maxWait: 10000
    poolPreparedStatements: false
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  servlet:
    multipart:
      max-request-size: 32MB # request max size
      max-file-size: 32MB # single file size
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

constant:
  defaultChainId: "chain0_group0"
  
  bac20Address: "[#bac20_address]"
  rechargeProxyAddress: "[#rechargeProxy_address]"
  weworldManageAddress: "[#weworld_manage_address]"
  beanSystemRecycleAddress: ""
  zombieAddress: "[#zombie_address]"
  redPacketProxyAddress: "[#red_packet_proxy_address]"
  ## 统计数据刷新间隔（ms）
  cacheInterval: 60000
  
  ## certPath
  v3ConfigPath: "conf/cert-v3/"

  ## block info (pulling data from chain)
  isBlockPullFromZero: true
  pullBlockInitCnts: 200
  pullBlockSleepTime: 10
  pullBlockTaskCron: "0/10 * * * * ?"
  pullBlockTimeout: 600000
  blockRetainMax: 100
  transRetainMax: 1000
  ## delete retain max block and trans data
  isDeleteInfo: true
  deleteInfoTimeout: 30000
  deleteInfoCron: "*/30 * * * * ?"
  ## stat txn daily
  statisticsTransDailyCron: "0/30 * * * * ?"
  ## 每分钟更新一次bac20的统计数据
  syncStatTaskCron: "0 0/1 * * * ?"
  userFlowMaxCnt: 50000
  orgFlowMaxCnt: 200000
  
  privateStr: "[#system_private_key]"
  publicStr: ""

jedis:
  # config
  ip: [#redis_host]
  port: [#redis_port]
  authPwd: [%redis_auth]
  # pool
  maxTotal: 32
  maxIdle: 32
  minIdle: 16
  maxWaitMillis: 1000
  connectionTimeout: 1000
  socketTimeout: 1000
  testOnBorrow: false
  # jedis db index, -1是不选db
  select: [#redis_index]

mybatis:
  typeAliasesPackage: com.webank.wsbcs.chdis.common.dao
  configuration:
    map-underscore-to-camel-case: true

executor:
  corePoolSize: 50
  maxPoolSize: 75
  queueSize: 50
  threadNamePrefix: "server-async-"

logging:
  config: classpath:log4j2.xml
  level:
    com.webank.wsbcs.chdis: info

swagger:
  enabled: true
