import org.gradle.api.tasks.compile.JavaCompile

group = 'com.webank.wbbc'
version = '1.0.0'

apply plugin: 'maven'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'

sourceCompatibility = 1.8
targetCompatibility = 1.8

[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'

// In this section you declare where to find the dependencies of your project
repositories {
    maven {
        url "http://maven.weoa.com/nexus/content/groups/public/"
    }
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url 'https://dl.bintray.com/ethereum/maven/' }
    mavenLocal()
}

def springboot_version="2.7.18"
List springboot = [
    "org.springframework.boot:spring-boot-starter-web:$springboot_version",
    "org.springframework.boot:spring-boot-starter-aop:$springboot_version",
    "org.springframework.boot:spring-boot-starter-jdbc:$springboot_version",
    "org.springframework.boot:spring-boot-autoconfigure:$springboot_version",
    "org.springframework.boot:spring-boot-configuration-processor:$springboot_version",
    "org.springframework.boot:spring-boot-starter-validation:$springboot_version"
]

def spring_version="5.3.34"
List spring = [
     "org.springframework:spring-web:$spring_version",
     "org.springframework:spring-webmvc:$spring_version"
]

List jaxb = [
    "javax.xml.bind:jaxb-api:2.3.0",
    "com.sun.xml.bind:jaxb-impl:2.3.0",
    "com.sun.xml.bind:jaxb-core:2.3.0",
    "javax.activation:activation:1.1.1"
]

List lombok = [
    "org.projectlombok:lombok:1.18.12"
]

List jwt = [
    "io.jsonwebtoken:jjwt:0.9.1"
]

List swagger = [
    'io.springfox:springfox-boot-starter:3.0.0'
]

def jackson_version = "2.14.2"
List jackson = [
    "com.fasterxml.jackson.core:jackson-databind:$jackson_version",
    "com.fasterxml.jackson.core:jackson-annotations:$jackson_version",
    "com.fasterxml.jackson.core:jackson-core:$jackson_version",
    "com.fasterxml.jackson.module:jackson-module-parameter-names:$jackson_version",
    "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:$jackson_version",
    "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jackson_version",
    "org.springframework.boot:spring-boot-starter-validation:$springboot_version"
]

List mysql = [
    'mysql:mysql-connector-java:8.0.33',
    'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
]

List test = [
    "org.springframework.boot:spring-boot-starter-test:$springboot_version",
    "com.github.yuanmomo:mybatis-generator-plugin:1.0.11",
]

def log4j_version="2.20.0"
List log4j = [
    "org.apache.logging.log4j:log4j-api:$log4j_version",
    "org.apache.logging.log4j:log4j-core:$log4j_version",
    "org.apache.logging.log4j:log4j-slf4j-impl:$log4j_version",
    "org.apache.logging.log4j:log4j-web:$log4j_version",
    "com.lmax:disruptor:3.4.4"
]

List druid = ['com.alibaba:druid:1.2.10']

List webank = [
    'cn.webank.bsp:encrypt:0.1.0',
    'cn.webank.uuid:webank-uuid:1.0.8'
]

List shedlock = [
    'net.javacrumbs.shedlock:shedlock-spring:4.44.0',
    'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:4.44.0'
]

dependencies {
    compile springboot,spring,jaxb,jwt,swagger,jackson,mysql,log4j,druid,webank
    compile ('org.fisco-bcos.java-sdk:fisco-bcos-java-sdk:2.9.3') {
        exclude group: "org.fisco-bcos.java-sdk" exclude group: "org.slf4j"
    }
    compile ('org.fisco-bcos.java-sdk:fisco-bcos-java-sdk-v3:3.7.0') {
        exclude group: "org.fisco-bcos.java-sdk" exclude group: "org.slf4j"
    }
    compile 'org.fisco-bcos:bcos-sdk-jni:3.7.0'
    compile 'redis.clients:jedis:3.6.0'
    compile "org.apache.commons:commons-lang3:3.8.1"
    compile "org.apache.commons:commons-configuration2:2.8.0"
    compile 'org.apache.commons:commons-collections4:4.4'
    compile 'org.apache.commons:commons-text:1.10.0'
    compile 'com.google.code.gson:gson:2.8.9'
    compile "cn.hutool:hutool-all:5.8.21"
    compile 'org.yaml:snakeyaml:2.0'
    compile group: 'io.netty', name: 'netty-all', version: '4.1.101.Final'
    compile 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    
    compileOnly lombok
    annotationProcessor lombok

    testCompileOnly lombok
    testAnnotationProcessor lombok

    testCompile test
}

configurations {
    all*.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    all*.exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    all*.exclude group: 'log4j', module: 'log4j'
    all*.exclude group: 'org.ow2.asm', module: 'asm'
    all*.exclude group: 'jline', module: 'jline'
    all*.exclude group: 'com.google.protobuf', module: 'protobuf-java'
    all*.exclude group: 'javax.annotation', module: 'javax.annotation-api'
    all*.exclude group: 'org.ethereum'
    all*.exclude module: 'bcprov-jdk15on' // 切换成bcprov-jdk18on
    all*.exclude module: 'bcprov-jdk16on'    // 切换成bcprov-jdk18on
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

clean {
    delete 'dist'
    delete 'build'
    delete 'logs'
}

jar {
    destinationDir file('dist/apps')
    archiveName project.name + '.jar'
    exclude '**/*.xml'
    exclude '**/*.yml'
    exclude '**/*.properties'

    doLast {
        copy {
            from file('src/main/resources/prd')
            into 'dist/conf'
            exclude '**/dev'
            exclude '**/static'
        }
        copy {
            from file('script/')
            into 'dist/script'
        }
        copy {
            from configurations.runtime
            into 'dist/lib'
        }
        copy {
            from file('.').listFiles().findAll{File f -> (f.name.endsWith('.sh') || f.name.endsWith('.env'))}
            into 'dist'
        }
        copy {
            from file('release_note.txt')
            into 'dist'
        }
    }
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }
}
