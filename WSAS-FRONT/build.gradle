import org.gradle.api.tasks.compile.JavaCompile

group = 'com.webank.wsas'
version = '1.0.0'

apply plugin: 'maven'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'

sourceCompatibility = 1.8
targetCompatibility = 1.8

[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'

repositories {
    maven { url "http://maven.weoa.com/nexus/content/groups/public/" }
    mavenCentral()
}

def log4j_version = "2.20.0"
List logger = [
    "org.apache.logging.log4j:log4j-api:$log4j_version",
    "org.apache.logging.log4j:log4j-core:$log4j_version",
    "org.apache.logging.log4j:log4j-slf4j-impl:$log4j_version",
    "org.apache.logging.log4j:log4j-web:$log4j_version"
]

def springboot_version="2.7.18"
List springboot = [
     "org.springframework.boot:spring-boot-starter-reactor-netty:$springboot_version",
     "org.springframework.boot:spring-boot-starter-webflux:$springboot_version",
]

def spring_version="5.3.34"
List spring = [
     "org.springframework:spring-web:$spring_version"
]

def jackson_version = "2.14.2"
List jackson = [
    "com.fasterxml.jackson.core:jackson-core:$jackson_version",
    "com.fasterxml.jackson.core:jackson-databind:$jackson_version",
    "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:$jackson_version",
    "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jackson_version",
    "com.fasterxml.jackson.module:jackson-module-parameter-names:$jackson_version"
]

dependencies {
    compile logger,springboot,jackson,spring
    compile group: 'org.springframework.cloud', name: 'spring-cloud-starter-gateway', version: '3.1.7'
    compile group: 'org.yaml', name: 'snakeyaml', version: '2.0'
    compile group: 'com.lmax', name: 'disruptor', version: '3.4.4'
    compile group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
    compile group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
    compile group: 'org.apache.commons', name: 'commons-pool2', version: '2.11.1'
    compile group: 'commons-fileupload', name: 'commons-fileupload', version: '1.5'
    compile group: 'com.google.guava', name: 'guava', version: '32.1.2-jre'

    testCompile group: 'junit', name: 'junit', version: '4.12'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.22'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.22'
}

configurations {
    all*.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    all*.exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    all*.exclude group: 'log4j', module: 'log4j'
    all*.exclude group: 'org.ow2.asm', module: 'asm'
    all*.exclude group: 'jline', module: 'jline'
    all*.exclude group: 'com.google.protobuf', module: 'protobuf-java'
    all*.exclude group: 'javax.annotation', module: 'javax.annotation-api'
    all*.exclude group: 'org.ethereum'
    all*.exclude group: 'com.alibaba', module: 'fastjson'
    all*.exclude module: 'bcprov-jdk15' // 切换成bcprov-jdk18on
    all*.exclude module: 'bcprov-jdk16'    // 切换成bcprov-jdk18on
    all*.exclude module: 'bcutil-jdk15on'    // 切换成bcutil-jdk18on
    all*.exclude module: 'bcpkix-jdk15on'    // 切换成bcpkix-jdk18on
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

clean {
    delete 'dist'
    delete 'build'
    delete 'logs'
}

jar {
    destinationDir file('dist/apps')
    archiveName project.name + '.jar'
    exclude '**/*.xml'
    exclude '**/*.yml'
    exclude '**/*.properties'

    doLast {
        copy {
            from file('src/main/resources')
            into 'dist/conf'
        }
        copy {
            from configurations.runtime
            into 'dist/lib'
        }
        copy {
            from file('.').listFiles().findAll{File f -> (f.name.endsWith('.sh') || f.name.endsWith('.env'))}
            into 'dist'
        }
        copy {
            from file('release_note.txt')
            into 'dist'
        }
    }
}